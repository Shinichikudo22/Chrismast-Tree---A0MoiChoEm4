<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Christmas Tree 3D - Thắp Sáng Cây Thông Gây Quỹ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080a10;
      color: #c8d2e6;
      font-family: Consolas, Menlo, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      background: #080a10;
      cursor: grab;
      max-width: 100%;
      max-height: 100%;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* =========================================================
       1. LOGO CLB GÓC TRÊN BÊN PHẢI
       ========================================================= */
    #clubLogoBox {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(12, 16, 26, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 196, 90, 0.32);
      border-radius: 10px;
      padding: 6px 11px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    #clubLogoBox img {
      height: 36px;
      width: auto;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }
    #clubLogoBox span {
      font-size: 11.5px;
      font-weight: bold;
      color: #ffe28a;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    /* Cụm nút điều khiển góc dưới phải */
    #controls {
      position: fixed;
      bottom: 14px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      z-index: 15;
      opacity: 0.88;
      transition: opacity 0.2s;
    }
    #controls:hover {
      opacity: 1;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      color: #d0daf0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: rgba(255, 196, 90, 0.2);
      border-color: #ffc45a;
      color: #fff;
    }
    .btn-charm {
      background: rgba(255, 196, 90, 0.15);
      border-color: rgba(255, 196, 90, 0.52);
      color: #ffe28a;
      font-weight: bold;
    }

    /* Bảng tiến độ gây quỹ & tìm vị trí người mua */
    #fundraiserBox {
      position: fixed;
      top: 12px;
      left: 14px;
      z-index: 20;
      width: 322px;
      max-width: calc(100vw - 28px);
      background: rgba(12, 16, 26, 0.86);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 196, 90, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #fundraiserHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .campaign-title {
      font-size: 12px;
      font-weight: bold;
      color: #ffc45a;
    }
    .progress-wrap {
      position: relative;
      margin-top: 7px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 99px;
      height: 7px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5b62, #ffc45a, #4cd97b);
      transition: width 0.4s ease;
    }
    .milestone-tick {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.65);
    }
    .progress-meta {
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #b4c0d8;
    }
    .milestone-row {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      font-size: 10.5px;
    }
    .ms-pill {
      flex: 1;
      text-align: center;
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #7e8aa3;
    }
    .ms-pill.unlocked {
      background: rgba(255, 196, 90, 0.16);
      border-color: rgba(255, 196, 90, 0.55);
      color: #ffe28a;
      font-weight: bold;
    }

    #fundraiserBody {
      margin-top: 10px;
      display: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 9px;
    }
    #fundraiserBox.open #fundraiserBody {
      display: block;
    }
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }
    .quota-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 5px;
      padding: 3px 5px;
      text-align: center;
      color: #9aa7c2;
    }
    .quota-chip.vault-chip {
      background: rgba(255, 196, 90, 0.12);
      border-color: rgba(255, 196, 90, 0.38);
      color: #ffe28a;
      cursor: pointer;
    }
    #searchInput {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 9px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #searchInput:focus {
      border-color: #ffc45a;
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 3px 6px;
      font-size: 10.5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: rgba(255, 196, 90, 0.25);
      border-color: #ffc45a;
      color: #fff;
    }
    #donorList {
      margin-top: 8px;
      max-height: 190px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }
    #donorList::-webkit-scrollbar,
    .vault-grid::-webkit-scrollbar,
    .wish-card::-webkit-scrollbar {
      width: 4px;
    }
    #donorList::-webkit-scrollbar-thumb,
    .vault-grid::-webkit-scrollbar-thumb,
    .wish-card::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }
    .donor-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 11.5px;
      transition: all 0.15s;
    }
    .donor-item:hover,
    .donor-item.selected {
      background: rgba(255, 196, 90, 0.16);
      border-color: rgba(255, 196, 90, 0.55);
      color: #fff;
    }
    .donor-code {
      color: #ffc45a;
      font-weight: bold;
      margin-right: 4px;
    }
    .donor-badge {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    /* Tooltip nổi theo chuột */
    #hoverTip {
      position: fixed;
      pointer-events: none;
      z-index: 25;
      display: none;
      background: rgba(10, 14, 24, 0.92);
      border: 1px solid #ffc45a;
      color: #fff;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transform: translate(12px, -50%);
    }

    /* =========================================================
       2. THIỆP ĐIỀU ƯỚC & HIỂN THỊ MẪU THIẾT KẾ BÙA
       ========================================================= */
    #wishModal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 12, 0.65);
      backdrop-filter: blur(4px);
      padding: 16px;
    }
    #wishModal.visible {
      display: flex;
    }
    .wish-card {
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(160deg, #151c30 0%, #0c101b 100%);
      border: 1px solid rgba(255, 196, 90, 0.58);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.78);
      position: relative;
      animation: popCard 0.22s ease-out;
    }
    @keyframes popCard {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .wish-close {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 3px 8px;
      font-size: 13px;
      z-index: 2;
    }
    .wish-tag {
      display: inline-block;
      font-size: 11px;
      color: #ffc45a;
      background: rgba(255, 196, 90, 0.14);
      border: 1px solid rgba(255, 196, 90, 0.35);
      padding: 3px 8px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .wish-art-frame {
      display: none;
      margin: 2px auto 12px auto;
      padding: 7px;
      border-radius: 10px;
      background: radial-gradient(circle, rgba(255, 210, 90, 0.2) 0%, rgba(255, 255, 255, 0.03) 75%);
      border: 1px solid rgba(255, 196, 90, 0.42);
      text-align: center;
    }
    .wish-art-frame.show {
      display: block;
    }
    .wish-art-frame img {
      max-width: 100%;
      max-height: 250px;
      width: auto;
      border-radius: 7px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }
    .wish-owner {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .wish-content {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #ffc45a;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.55;
      color: #e6eefc;
      user-select: text;
    }
    .wish-actions {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .wish-hint {
      font-size: 11px;
      color: #8b98b3;
    }

    /* =========================================================
       3. KHO LƯU TRỮ BÙA QUA MÔN (KHÔNG GẮN LÊN CÂY THÔNG)
       ========================================================= */
    #charmVaultModal {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 12, 0.74);
      backdrop-filter: blur(5px);
      padding: 16px;
    }
    #charmVaultModal.visible {
      display: flex;
    }
    .vault-panel {
      width: 100%;
      max-width: 780px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(165deg, #131a2d 0%, #0a0e18 100%);
      border: 1px solid rgba(255, 196, 90, 0.5);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.85);
      animation: popCard 0.22s ease-out;
    }
    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .vault-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffe28a;
    }
    .vault-sub {
      font-size: 11.5px;
      color: #9aa7c2;
      margin-top: 3px;
    }
    #vaultSearch {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      margin-bottom: 12px;
    }
    #vaultSearch:focus {
      border-color: #ffc45a;
    }
    .vault-grid {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      padding-right: 4px;
    }
    .vault-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 196, 90, 0.24);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .vault-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 196, 90, 0.12);
      border-color: #ffc45a;
    }
    .vault-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #ffc45a;
    }
    .vault-card-thumb {
      width: 100%;
      height: 110px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.28);
      padding: 4px;
    }
    .vault-card-name {
      font-size: 12.5px;
      font-weight: bold;
      color: #fff;
    }
    .vault-card-wish {
      font-size: 11px;
      color: #c2cde3;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 680px) {
      #clubLogoBox {
        top: auto;
        bottom: 54px;
        right: 14px;
        padding: 4px 8px;
      }
      #clubLogoBox img {
        height: 26px;
      }
      #clubLogoBox span {
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="screen"></canvas>

    <!-- =====================================================================
         VỊ TRÍ 1: LOGO CLB (Đặt file logo-clb.png cùng thư mục với index.html)
         ===================================================================== -->
    <div id="clubLogoBox">
      <img src="logo-clb.png" alt="Logo CLB" onerror="this.style.display='none'" />
      <span>CLB HIẾN MÁU ĐHTN</span>
    </div>

    <!-- Bảng tiến độ gây quỹ & tìm vị trí người mua -->
    <div id="fundraiserBox">
      <div id="fundraiserHeader" title="Bấm để mở danh sách & tìm vị trí của bạn">
        <span class="campaign-title" id="campaignTitle">🎄 THẮP SÁNG CÂY THÔNG 2026</span>
        <button type="button" id="btnTogglePanel" style="padding: 2px 7px; font-size: 11px;">Tìm của bạn ▼</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
        <div class="milestone-tick" title="Mốc 50%: Bật dây kim tuyến vàng"></div>
      </div>
      <div class="progress-meta">
        <span id="progressText">Hoàn thành cây: 0%</span>
        <span id="lightStatText">💡 0/168 đèn</span>
      </div>
      <div class="milestone-row">
        <div class="ms-pill" id="pill50">🔒 50%: Kim tuyến vàng</div>
        <div class="ms-pill" id="pill100">🔒 100%: Ngôi sao đỉnh</div>
      </div>

      <div id="fundraiserBody">
        <div class="quota-grid" id="quotaGrid"></div>
        <input type="text" id="searchInput" placeholder="Nhập tên hoặc mã (VD: MS01, QM01)..." />
        <div class="filter-tabs">
          <button type="button" class="tab-btn active" data-filter="all">Tất cả</button>
          <button type="button" class="tab-btn" data-filter="qua_mon">🎓 Bùa qua môn</button>
          <button type="button" class="tab-btn" data-filter="charm">🧧 Bùa cây</button>
          <button type="button" class="tab-btn" data-filter="light">💡 Cụm đèn</button>
          <button type="button" class="tab-btn" data-filter="ornament">🎁 Quà/Châu/Tất</button>
        </div>
        <div id="donorList"></div>
        <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px;">
          <button type="button" id="btnOpenVaultSmall" class="btn-charm" style="padding: 3px 8px; font-size: 11px;">🎓 Xem kho bùa qua môn</button>
          <button type="button" id="btnClearFocus" style="padding: 3px 7px; font-size: 11px; display: none;">Bỏ chọn</button>
        </div>
      </div>
    </div>

    <!-- Tooltip nổi theo chuột -->
    <div id="hoverTip"></div>

    <!-- Thiệp hiện điều ước & mẫu thiết kế bùa -->
    <div id="wishModal">
      <div class="wish-card">
        <button type="button" class="wish-close" id="btnCloseModal">✕</button>
        <div class="wish-tag" id="modalBadge">🧧 Bùa May Mắn</div>
        <div class="wish-art-frame" id="modalArtFrame">
          <img id="modalArtImg" src="" alt="Mẫu thiết kế bùa" />
        </div>
        <div class="wish-owner" id="modalOwner">Tên người gửi</div>
        <div class="wish-content" id="modalWish">Lời chúc...</div>
        <div class="wish-actions">
          <span class="wish-hint" id="modalHint">Vị trí đang phát sáng trên cây</span>
          <button type="button" id="btnCopyLink">🔗 Chép link của tôi</button>
        </div>
      </div>
    </div>

    <!-- Kho lưu trữ Bùa Qua Môn (Chứa không giới hạn, không gắn lên cây thông) -->
    <div id="charmVaultModal">
      <div class="vault-panel">
        <div class="vault-header">
          <div>
            <div class="vault-title" id="vaultTitle">🎓 KHO BÙA QUA MÔN (0 LÁ BÙA)</div>
            <div class="vault-sub">Bấm vào lá bùa của bạn để xem mẫu thiết kế, lời chúc và lấy link chia sẻ</div>
          </div>
          <button type="button" id="btnCloseVault" style="padding: 4px 10px;">✕ Đóng</button>
        </div>
        <input type="text" id="vaultSearch" placeholder="Tìm tên của bạn hoặc mã bùa (VD: QM01)..." />
        <div class="vault-grid" id="vaultGrid"></div>
        <div style="margin-top: 10px; text-align: center;">
          <button type="button" id="btnLoadMoreVault" style="display: none;">Xem thêm lá bùa ▼</button>
        </div>
      </div>
    </div>

    <!-- Đặt file nhạc .mp3 cùng thư mục với index.html -->
    <audio id="bgMusic" src="last-christmas.mp3" loop preload="auto"></audio>

    <div id="controls">
      <button id="btnOpenVault" class="btn-charm">🎓 Bùa Qua Môn</button>
      <button id="btnMusic">M: Music Off</button>
      <button id="btnPause">Space: Pause</button>
      <button id="btnRestart">R: Restart</button>
      <button id="btnSave">S: Save PNG</button>
    </div>
  </div>

  <script>
    (() => {
      // =====================================================================
      // 1. CẤU HÌNH CHIẾN DỊCH GÂY QUỸ & MẪU THIẾT KẾ BÙA
      // =====================================================================
      const CAMPAIGN = {
        title: "🎄 THẮP SÁNG CÂY THÔNG 2026",
        lightsPerPurchase: 4,    // Mỗi lượt mua đèn sẽ thắp sáng 1 chùm 4 bóng gần nhau (42 suất x 4 = 168 bóng)
        showUnlitBulbs: true,    // Hiện bóng chưa mua dưới dạng chấm mờ tối chờ thắp sáng
        message: "M E R R Y   C H R I S T M A S   2 0 2 6",
        watermark: "@ascii.christmas",

        // VỊ TRÍ 2: MẪU THIẾT KẾ BÙA (Đặt file ảnh PNG/JPG cùng thư mục với index.html)
        charmDesigns: {
          qua_mon: "bua-qua-mon.png",   // Mẫu thiết kế Bùa Qua Môn (dùng cho kho EXAM_CHARMS)
          jade:    "bua-binh-an.png",   // Mẫu bùa treo cây màu ngọc
          gold:    "bua-tai-loc.png",   // Mẫu bùa treo cây màu vàng
          red:     "bua-may-man.png"    // Mẫu bùa treo cây màu đỏ
        },

        // Phân bổ 137 suất chuẩn thẩm mỹ 3D & trọng số tính % hoàn thành cây (Tổng = 328 điểm = 100%)
        quotas: {
          light:    { max: 42, weight: 1.5, icon: "💡", short: "Đèn" },
          bauble:   { max: 30, weight: 2.0, icon: "🔮", short: "Châu" },
          stocking: { max: 20, weight: 2.5, icon: "🧦", short: "Tất" },
          charm:    { max: 25, weight: 3.0, icon: "🧧", short: "Bùa cây" },
          gift:     { max: 20, weight: 4.0, icon: "🎁", short: "Quà" }
        }
      };

      function getTreeCompletion() {

      let seed = 7;
      function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      }
      function uniform(a, b) {
        return a + (b - a) * rand();
      }
      function gauss() {
        let u = 0, v = 0;
        while (u === 0) u = rand();
        while (v === 0) v = rand();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(TAU * v);
      }
      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }
      function smoothstep(x) {
        const t = clamp(x, 0, 1);
        return t * t * (3 - 2 * t);
      }
      function normalize(x, y, z) {
        const len = Math.hypot(x, y, z) || 1;
        return [x / len, y / len, z / len];
      }
      function fibSphere(n) {
        const pts = [];
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = golden * i;
          pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
        }
        return pts;
      }

      const PALETTE_MAP = {

      const T_STAR = 10.4;
      const T_MSG = 11.4;

      function envelope(y) {
        const u = clamp((y - Y0) / (Y1 - Y0), 0, 1);
        return 0.78 * Math.pow(1 - u, 0.82) + 0.03;
      }
      function growTime(y) {
        const u = clamp((Y1 - y) / (Y1 - GROUND), 0, 1);
        return T_GROW[0] + (T_GROW[1] - T_GROW[0]) * u;

        points.push({

          kind, t0, base, phase,
          cx, cy, cz, pop,
          donorId, lit

      }

      function spawnBauble(donor, slotIdx) {
        const sphere = fibSphere(145);
        const u = ((slotIdx * 0.6180339) % 1);
        const y = Y0 + 0.10 + u * (Y1 - Y0 - 0.36);
        const a = slotIdx * 2.39996 + 0.3;
        const rEnv = envelope(y) + 0.035 * (1 - u);
        const cx = Math.cos(a) * rEnv;
        const cy = y - 0.03;
        const cz = Math.sin(a) * rEnv;
        const rad = 0.064 + 0.025 * (1 - u);
        const col = resolveColor(donor.color, PALETTE_MAP.red);
        const t0 = T_ORNAMENTS[0] + (slotIdx % 8) * 0.25;

        for (const [sx, sy, sz] of sphere) {
          addPoint(
            cx + sx * rad, cy + sy * rad, cz + sz * rad,
            sx, sy, sz, col, "BALL", t0, 1.0, 0,
            cx, cy, cz, true, donor.id, true

        donorAnchors.push({ donor, x: cx, y: cy, z: cz, radius: 14 });
