      });
      charmVaultModal.addEventListener("click", (e) => {
        if (e.target === charmVaultModal) charmVaultModal.classList.remove("visible");
      });
      vaultSearch.addEventListener("input", () => {
        vaultLimit = 36;
        renderVaultGrid();
      });
      btnLoadMoreVault.addEventListener("click", () => {
        vaultLimit += 36;
        renderVaultGrid();
      });

      renderDonorList();

      try {
        const initParam = new URLSearchParams(window.location.search).get("me");
        if (initParam) {
          const matched = allSearchableItems.find(d => d.id.toLowerCase() === initParam.trim().toLowerCase());
          if (matched) setTimeout(() => focusDonor(matched.id, true), 150);
        }
      } catch (_) {}

      // =====================================================================
      // 7. ĐIỀU KHIỂN NHẠC NỀN, VUỐT XOAY CÓ QUÁN TÍNH & CLICK VẬT PHẨM
      // =====================================================================
      const bgMusic = document.getElementById("bgMusic");
      const btnMusic = document.getElementById("btnMusic");
      let musicPlaying = false;
      let paused = false;
      bgMusic.volume = 0.65;

      function updateMusicUI() {
        if (isMobileView()) {
          btnMusic.textContent = musicPlaying ? "🔊 Nhạc" : "🔇 Nhạc";
        } else {
          btnMusic.textContent = musicPlaying ? "M: Music On" : "M: Music Off";
        }
      }

      function updateControlLabels() {
        const mob = isMobileView();
        document.getElementById("btnOpenVault").textContent = mob ? "🎓 Qua môn" : "🎓 Bùa Qua Môn";
        document.getElementById("btnPause").textContent = paused
          ? (mob ? "▶ Chạy" : "Space: Play")
          : (mob ? "⏸ Dừng" : "Space: Pause");
        document.getElementById("btnRestart").textContent = mob ? "🔄 Lại" : "R: Restart";
        document.getElementById("btnSave").textContent = mob ? "📸 Lưu" : "S: Save PNG";
        updateMusicUI();
      }

      window.addEventListener("resize", () => {
        fitCanvas();
        updateControlLabels();
      });
      window.addEventListener("load", () => {
        fitCanvas();
        updateControlLabels();
      });
      fitCanvas();
      updateControlLabels();

      function toggleMusic() {
        if (musicPlaying) {
          bgMusic.pause();
          musicPlaying = false;
          updateMusicUI();
        } else {
          bgMusic.play().then(() => {
            musicPlaying = true;
            updateMusicUI();
          }).catch(() => {});
        }
      }
      function autoStartMusic() {
        if (!musicPlaying) {
          bgMusic.play().then(() => {
            musicPlaying = true;
            updateMusicUI();
          }).catch(() => {});
        }
        window.removeEventListener("pointerdown", autoStartMusic);
        window.removeEventListener("keydown", autoStartMusic);
      }
      window.addEventListener("pointerdown", autoStartMusic);
      window.addEventListener("keydown", autoStartMusic);
      btnMusic.onclick = toggleMusic;

      let dragging = false;
      let dragMoved = false;
      let lastMouseX = 0;
      let lastMoveTime = 0;
      let lastTime = performance.now();

      function findHitDonor(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        const px = ((clientX - rect.left) / rect.width) * (COLS * CW);
        const py = ((clientY - rect.top) / rect.height) * (ROWS * CH);
        const tapScale = isMobileView() ? 1.85 : 1.0;

        let best = null;
        let bestDist = Infinity;
        for (const item of screenHitList) {
          const d = Math.hypot(px - item.x, py - item.y);
          if (d <= item.r * tapScale && d < bestDist) {
            best = item.donor;
            bestDist = d;
          }
        }
        return best;
      }

      canvas.addEventListener("pointerdown", (e) => {
        dragging = true;
        dragMoved = false;
        targetAngle = null;
        dragVelocity = 0;
        lastMouseX = e.clientX;
        lastMoveTime = performance.now();
      });

      window.addEventListener("pointermove", (e) => {
        if (dragging) {
          const now = performance.now();
          const dx = e.clientX - lastMouseX;
          if (Math.abs(dx) > 3) dragMoved = true;
          const sens = e.pointerType === "touch" ? 0.017 : 0.011;
          const dAng = dx * sens;
          angle += dAng;
          const dtMove = Math.max((now - lastMoveTime) / 1000, 0.008);
          dragVelocity = clamp(dAng / dtMove, -12, 12);
          lastMouseX = e.clientX;
          lastMoveTime = now;
          hoverTip.style.display = "none";
          return;
        }

        if (e.pointerType === "touch") return;

        const hit = findHitDonor(e.clientX, e.clientY);
        hoveredDonorId = hit ? hit.id : null;
        hoveredDonorIdx = hit && DONOR_ID_TO_IDX.has(hit.id) ? DONOR_ID_TO_IDX.get(hit.id) : -1;

        if (hit) {
          const meta = TYPE_META[hit.type] || TYPE_META.light;
          canvas.style.cursor = "pointer";
          hoverTip.style.display = "block";
          hoverTip.style.left = `${e.clientX}px`;
          hoverTip.style.top = `${e.clientY}px`;
          hoverTip.innerHTML = `${meta.icon} <b>[${hit.id}] ${hit.name}</b><br><span style="color:#ffc45a;font-size:10.5px;">Bấm để mở điều ước</span>`;
        } else {
          canvas.style.cursor = "grab";
          hoverTip.style.display = "none";
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (dragging) {
          if (!dragMoved) {
            dragVelocity = 0;
            const hit = findHitDonor(e.clientX, e.clientY);
            if (hit) focusDonor(hit.id, true);
          } else if (performance.now() - lastMoveTime > 90) {
            dragVelocity = 0;
          }
        }
        dragging = false;
      });

      function togglePause() {
        paused = !paused;
        updateControlLabels();
      }
      function restartScene() {
        elapsed = 0;
        angle = 0;
        dragVelocity = 0;
        clearFocus();
        paused = false;
        updateControlLabels();
      }
      function saveScreenshot() {
        const link = document.createElement("a");
        link.download = "ascii-christmas-tree.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      document.getElementById("btnPause").onclick = togglePause;
      document.getElementById("btnRestart").onclick = restartScene;
      document.getElementById("btnSave").onclick = saveScreenshot;

      window.addEventListener("keydown", (e) => {
        if (document.activeElement === searchInput || document.activeElement === vaultSearch) return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePause();
        } else if (e.key === "r" || e.key === "R") {
          restartScene();
        } else if (e.key === "s" || e.key === "S") {
          saveScreenshot();
        } else if (e.key === "m" || e.key === "M") {
          toggleMusic();
        } else if (e.key === "Escape") {
          wishModal.classList.remove("visible");
          charmVaultModal.classList.remove("visible");
        }
      });

      // =====================================================================
      // 8. VÒNG LẶP RENDER TỐI ƯU KHÔNG CẤP PHÁT BỘ NHỚ RÁC (ZERO-GC)
      // =====================================================================
      const zBuf = new Float32Array(COLS * ROWS);
      const charGrid = new Uint8Array(COLS * ROWS);
      const colorGrid = new Uint32Array(COLS * ROWS);
      const [LX, LY, LZ] = normalize(0.55, 0.72, -0.45);

      const charStrCache = new Array(256);
      for (let c = 0; c < 256; c++) charStrCache[c] = String.fromCharCode(c);
      const colorStrCache = new Map();

      function getColorCss(packed) {
        let css = colorStrCache.get(packed);
        if (!css) {
          if (colorStrCache.size > 2048) colorStrCache.clear();
          css = `rgb(${(packed >> 16) & 255},${(packed >> 8) & 255},${packed & 255})`;
          colorStrCache.set(packed, css);
        }
        return css;
      }

      function render(now) {
        const dt = Math.min(Math.max((now - lastTime) / 1000, 0), 0.12);
        lastTime = now;

        const mob = isMobileView();
        const isPortrait = window.innerHeight > window.innerWidth;
        const activeCamZ = isPortrait ? 3.08 : 3.25;
        const activeFov = isPortrait ? 2.12 : 1.92;
        const autoSpeed = mob ? 0.52 : 0.40;

        if (!paused) {
          elapsed += dt;
          if (!dragging) {
            if (targetAngle !== null) {
              let diff = (targetAngle - angle) % TAU;
              if (diff > Math.PI) diff -= TAU;
              if (diff < -Math.PI) diff += TAU;
              angle += diff * Math.min(1, dt * 6.5);
            } else if (Math.abs(dragVelocity) > 0.03) {
              angle = (angle + dragVelocity * dt) % TAU;
              dragVelocity *= Math.pow(0.035, dt);
            } else if (!selectedDonorId) {
              dragVelocity = 0;
              angle = (angle + dt * autoSpeed) % TAU;
            }
          }
        }

        zBuf.fill(999);
        charGrid.fill(0);
        colorGrid.fill(0);

        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);
        const halfCols = COLS * 0.5;
        const halfRows = ROWS * 0.5;
        const projScaleX = activeFov * halfRows * aspect;
        const projScaleY = activeFov * halfRows;

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const twinkle = 0.5 + 0.5 * Math.sin(elapsed * st.speed + st.phase);
          if (twinkle > 0.25) {
            const idx = st.row * COLS + st.col;
            charGrid[idx] = twinkle > 0.82 ? st.chCode : 46;
            const b = (95 + 135 * twinkle) | 0;
            colorGrid[idx] = (b << 16) | ((b + 10) << 8) | Math.min(255, b + 35);
          }
        }

        for (let i = 0; i < groundPts.length; i++) {
          const gp = groundPts[i];
          const rx = gp.x * cosA - gp.z * sinA;
          const rz = gp.x * sinA + gp.z * cosA;
          const cy = gp.y + 0.34;
          const cz = rz + activeCamZ;
          const pz = cy * sinP + cz * cosP;
          if (pz <= 0.25) continue;

          const py = cy * cosP - cz * sinP;
          const col = Math.round(halfCols + (rx / pz) * projScaleX);
          const row = Math.round(halfRows - (py / pz) * projScaleY);

          if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            const idx = row * COLS + col;
            if (pz < zBuf[idx]) {
              zBuf[idx] = pz;
              charGrid[idx] = 46; // '.'
              const radialFade = clamp(1.15 - gp.dist / 2.5, 0.25, 1.0);
              const shade = clamp((145 - pz * 20) * radialFade, 38, 115) | 0;
              colorGrid[idx] = (shade << 16) | ((shade + 8) << 8) | (shade + 22);
            }
          }
        }

        const charmSway = Math.sin(elapsed * 2.4) * 0.011;
        const focusPulse = 0.58 + 0.35 * Math.sin(elapsed * 7.5);
        const hasSelection = selectedDonorIdx >= 0;

        for (let i = 0; i < ptCount; i++) {
          const age = elapsed - ptT0[i];
          if (age < 0) continue;

          let px = ptX[i], py = ptY[i], pz = ptZ[i];
          const flags = ptFlags[i];
          const isPop = (flags & 1) !== 0;
          const isLit = (flags & 2) !== 0;
          const kind = ptKind[i];

          if (isPop && age < 0.35) {
            const s = smoothstep(age / 0.35);
            px = ptCx[i] + (px - ptCx[i]) * s;
            py = ptCy[i] + (py - ptCy[i]) * s;
            pz = ptCz[i] + (pz - ptCz[i]) * s;
          }

          if (kind === KIND_CHARM) {
            px += charmSway;
          }

          const rx = px * cosA - pz * sinA;
          const rz = px * sinA + pz * cosA;
          const cy = py + 0.34;
          const cz = rz + activeCamZ;
          const projPz = cy * sinP + cz * cosP;
          if (projPz <= 0.25) continue;

          const projPy = cy * cosP - cz * sinP;
          const col = Math.round(halfCols + (rx / projPz) * projScaleX);
          const row = Math.round(halfRows - (projPy / projPz) * projScaleY);
          if (col < 0 || col >= COLS || row < 0 || row >= ROWS) continue;

          const idx = row * COLS + col;
          if (projPz >= zBuf[idx]) continue;

          zBuf[idx] = projPz;

          const nx = ptNx[i], ny = ptNy[i], nz = ptNz[i];
          const rnx = nx * cosA - nz * sinA;
          const rnz = nx * sinA + nz * cosA;
          const diff = Math.max(0, rnx * LX + ny * LY + rnz * LZ);

          let lum = ptBase[i] * (0.28 + 0.82 * diff);
          const rampIdx = Math.min(RAMP_LEN - 1, (clamp(lum, 0, 0.999) * RAMP_LEN) | 0);
          let chCode = RAMP_CODES[rampIdx];

          let spawnFlash = 0;
          if (isLit && age < 0.32) {
            spawnFlash = 1 - age / 0.32;
          }

          if (kind === KIND_LIGHT) {
            if (!isLit) {
              chCode = 183; // '·'
              lum = 0.16;
            } else {
              const pulse = 0.65 + 0.35 * Math.sin(elapsed * 5.0 + ptPhase[i]);
              lum = 0.84 + 0.35 * pulse;
              chCode = pulse > 0.72 ? 64 : 111; // '@' : 'o'
            }
          } else if (kind === KIND_CHARM) {
            const shimmer = 0.78 + 0.32 * Math.sin(elapsed * 4.5 + ptPhase[i]);
            lum = clamp(lum * shimmer + 0.3, 0.4, 1.2);
            chCode = shimmer > 0.95 ? 64 : 35; // '@' : '#'
          } else if (kind === KIND_CHARM_THREAD) {
            chCode = 124; // '|'
          } else if (kind === KIND_TINSEL) {
            const shimmer = 0.88 + 0.32 * Math.sin(elapsed * 4.5 + ptPhase[i]);
            lum = clamp(lum * shimmer + 0.35, 0.3, 1.25);
            chCode = shimmer > 1.02 ? 64 : lum > 0.65 ? 35 : 42; // '@', '#', '*'
          } else if (kind === KIND_CORE) {
            chCode = spawnFlash > 0.35 ? 61 : 46; // '=' : '.'
          }

          const dIdx = ptDonorIdx[i];
          const isSelected = hasSelection && dIdx === selectedDonorIdx;
          const isHovered = hoveredDonorIdx >= 0 && dIdx === hoveredDonorIdx;
          let focusBoost = 0;

          if (isSelected || isHovered) {
            focusBoost = focusPulse;
            if (kind === KIND_LIGHT) chCode = 64;
          } else if (hasSelection && dIdx >= 0) {
            lum *= 0.62;
          }

          const intensity = (isLit ? 0.35 : 0.22) + 0.78 * clamp(lum, 0, 1.15) + 0.6 * spawnFlash + focusBoost;
          const whiteMix = clamp(spawnFlash + focusBoost * 0.45, 0, 1);
          const pr = ptR[i], pg = ptG[i], pb = ptB[i];
          const baseR = pr + (1.0 - pr) * whiteMix;
          const baseG = pg + (1.0 - pg) * whiteMix;
          const baseB = pb + (1.0 - pb) * whiteMix;

          const r = Math.min(255, (baseR * 255 * intensity) | 0);
          const g = Math.min(255, (baseG * 255 * intensity) | 0);
          const b = Math.min(255, (baseB * 255 * intensity) | 0);

          charGrid[idx] = chCode;
          colorGrid[idx] = (r << 16) | (g << 8) | b;
        }

        screenHitList = [];
        let selectedScreenPos = null;

        if (elapsed >= T_ORNAMENTS[0]) {
          for (let i = 0; i < bulbTargets.length; i++) {
            const bt = bulbTargets[i];
            const p = project(bt.x, bt.y, bt.z, cosA, sinA, activeCamZ, activeFov);
            if (p && p.pz < 3.48) {
              screenHitList.push({ donor: bt.donor, x: p.sx * CW, y: p.sy * CH, r: bt.radius });
            }
          }
          for (let i = 0; i < donorAnchors.length; i++) {
            const anc = donorAnchors[i];
            const p = project(anc.x, anc.y, anc.z, cosA, sinA, activeCamZ, activeFov);
            if (!p) continue;
            if (p.pz < 3.48) {
              screenHitList.push({ donor: anc.donor, x: p.sx * CW, y: p.sy * CH, r: anc.radius });
            }
            if (anc.donor.id === selectedDonorId) {
              selectedScreenPos = { sx: p.sx, sy: p.sy, donor: anc.donor };
            }
          }
        }

        if (selectedScreenPos) {
          const sc = Math.round(selectedScreenPos.sx);
          const sr = Math.round(selectedScreenPos.sy);
          if (Math.sin(elapsed * 8) > -0.3) {
            const offsets = [[0, -2], [0, 2], [-3, 0], [3, 0]];
            for (const [dc, dr] of offsets) {
              const cc = sc + dc, rr = sr + dr;
              if (cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS) {
                const idx = rr * COLS + cc;
                charGrid[idx] = 43; // '+'
                colorGrid[idx] = (255 << 16) | (240 << 8) | 130;
              }
            }
          }
        }

        if (elapsed >= T_STAR) {
          const starProj = project(0, Y1 + 0.14, 0, cosA, sinA, activeCamZ, activeFov);
          if (starProj) {
            if (HAS_STAR) {
              const on = smoothstep((elapsed - T_STAR) / 0.35);
              const flash = Math.pow(clamp(1 - (elapsed - T_STAR) / 1.0, 0, 1), 2);
              const starSize = (2.1 + 1.6 * on) * (1 + 0.05 * Math.sin(elapsed * 5));
              drawStar(charGrid, colorGrid, zBuf, starProj.sx, starProj.sy, starSize, elapsed, flash);
            } else {
              const sc = Math.round(starProj.sx);
              const sr = Math.round(starProj.sy);
              if (sc >= 0 && sc < COLS && sr >= 0 && sr < ROWS) {
                const idx = sr * COLS + sc;
                charGrid[idx] = 43; // '+'
                colorGrid[idx] = (95 << 16) | (108 << 8) | 135;
              }
            }
          }
        }

        if (elapsed > T_MSG) {
          const msgRow = ROWS - 7;
          const x0 = Math.floor((COLS - CAMPAIGN.message.length) / 2);
          const shown = Math.min(CAMPAIGN.message.length, Math.floor((elapsed - T_MSG) * 10));

          for (let r = msgRow - 1; r <= msgRow + 1; r++) {
            for (let c = Math.max(0, x0 - 2); c < Math.min(COLS, x0 + shown + 2); c++) {
              charGrid[r * COLS + c] = 0;
            }
          }

          const palette = [[255, 75, 85], [255, 210, 75], [75, 220, 115]];
          for (let i = 0; i < shown; i++) {
            const chCode = CAMPAIGN.message.charCodeAt(i);
            if (chCode !== 32) {
              const tint = palette[(Math.floor(i / 2) + Math.floor(elapsed * 1.5)) % 3];
              const glow = 0.85 + 0.25 * Math.sin(elapsed * 5 + i * 0.4);
              const idx = msgRow * COLS + (x0 + i);
              charGrid[idx] = chCode;
              const mr = Math.min(255, (tint[0] * glow) | 0);
              const mg = Math.min(255, (tint[1] * glow) | 0);
              const mb = Math.min(255, (tint[2] * glow) | 0);
              colorGrid[idx] = (mr << 16) | (mg << 8) | mb;
            }
          }
        }

        ctx.fillStyle = "#080a10";
        ctx.fillRect(0, 0, COLS * CW, ROWS * CH);

        ctx.font = `bold ${FONT_PX}px Consolas, Menlo, "Courier New", monospace`;
        ctx.textBaseline = "top";

        let letterCount = 0;
        let lastPackedCol = -1;

        for (let r = 0; r < ROWS; r++) {
          const py = r * CH;
          const rowOffset = r * COLS;
          for (let c = 0; c < COLS; c++) {
            const idx = rowOffset + c;
            const chCode = charGrid[idx];
            if (chCode === 0) continue;
            letterCount++;
            const packedCol = colorGrid[idx];
            if (packedCol !== lastPackedCol) {
              ctx.fillStyle = getColorCss(packedCol);
              lastPackedCol = packedCol;
            }
            ctx.fillText(charStrCache[chCode], c * CW, py);
          }
        }

        if (selectedScreenPos) {
          const tag = `◄ [${selectedScreenPos.donor.id}] ${selectedScreenPos.donor.name}`;
          const tx = clamp((selectedScreenPos.sx + 3) * CW, 12, COLS * CW - tag.length * 7.6 - 12);
          const ty = clamp((selectedScreenPos.sy - 0.5) * CH, 18, (ROWS - 8) * CH);
          ctx.fillStyle = "rgba(10, 14, 24, 0.92)";
          ctx.fillRect(tx - 4, ty - 2, tag.length * 7.5 + 8, 18);
          ctx.strokeStyle = "#ffc45a";
          ctx.strokeRect(tx - 4, ty - 2, tag.length * 7.5 + 8, 18);
          ctx.fillStyle = "#ffe28a";
          ctx.font = `bold 12px Consolas, Menlo, "Courier New", monospace`;
          ctx.fillText(tag, tx, ty);
        }

        const hudFontPx = mob ? 15 : 12;
        const hudStep = mob ? 1.45 : 1.3;
        ctx.font = `${hudFontPx}px Consolas, Menlo, "Courier New", monospace`;

        ctx.fillStyle = "#ffc45a";
        ctx.fillText(`• tree ${treeStats.percent}%  t ${elapsed.toFixed(1).padStart(4, "0")}s`, 2 * CW, (ROWS - 1.5 - hudStep * 3) * CH);

        const deg = (((angle * 180) / Math.PI) % 360 + 360) % 360;
        ctx.fillStyle = "#b0a8c4";
        ctx.fillText(CAMPAIGN.watermark, 2 * CW, (ROWS - 1.5 - hudStep * 2) * CH);
        ctx.fillStyle = "#7a859e";
        ctx.fillText(
          `rotation ${deg.toFixed(2).padStart(6, "0")}°    lit ${litBulbsCount}/${totalBulbs}`,
          2 * CW,
          (ROWS - 1.5 - hudStep) * CH
        );
        ctx.fillText(
          `tree ${DONORS.length}/${treeStats.totalSlots}  qua-mon ${examCharmItems.length}  letters ${letterCount.toLocaleString("en-US")}`,
          2 * CW,
          (ROWS - 1.5) * CH
        );

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
