<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASCII Christmas Tree 3D - Thắp Sáng Cây Thông Gây Quỹ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #080a10;
      color: #c8d2e6;
      font-family: Consolas, Menlo, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
    }
    #wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas {
      display: block;
      background: #080a10;
      cursor: grab;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      will-change: contents;
    }
    canvas:active {
      cursor: grabbing;
    }

    #topHud {
      display: contents;
    }

    /* LOGO CLB GÓC TRÊN BÊN PHẢI (CỐ ĐỊNH TỪ MÃ NGUỒN) */
    #clubLogoBox {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 19;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(12, 16, 26, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 196, 90, 0.35);
      border-radius: 10px;
      padding: 6px 11px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    #clubLogoImg {
      height: 36px;
      width: auto;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }
    #clubLogoBox span.club-name {
      font-size: 11.5px;
      font-weight: bold;
      color: #ffe28a;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    /* Cụm nút điều khiển góc dưới phải */
    #controls {
      position: fixed;
      bottom: 14px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      z-index: 18;
      opacity: 0.92;
      transition: opacity 0.2s;
    }
    #controls:hover {
      opacity: 1;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      color: #d0daf0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:hover {
      background: rgba(255, 196, 90, 0.2);
      border-color: #ffc45a;
      color: #fff;
    }
    .btn-charm {
      background: rgba(255, 196, 90, 0.15);
      border-color: rgba(255, 196, 90, 0.52);
      color: #ffe28a;
      font-weight: bold;
    }

    /* Bảng tiến độ gây quỹ & tìm vị trí người mua */
    #fundraiserBox {
      position: fixed;
      top: 12px;
      left: 14px;
      z-index: 22;
      width: 322px;
      max-width: calc(100vw - 28px);
      background: rgba(12, 16, 26, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 196, 90, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #fundraiserHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .campaign-title {
      font-size: 12px;
      font-weight: bold;
      color: #ffc45a;
    }
    .progress-wrap {
      position: relative;
      margin-top: 7px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 99px;
      height: 7px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5b62, #ffc45a, #4cd97b);
      transition: width 0.4s ease;
    }
    .milestone-tick {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.65);
    }
    .progress-meta {
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #b4c0d8;
    }
    .milestone-row {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      font-size: 10.5px;
    }
    .ms-pill {
      flex: 1;
      text-align: center;
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #7e8aa3;
    }
    .ms-pill.unlocked {
      background: rgba(255, 196, 90, 0.16);
      border-color: rgba(255, 196, 90, 0.55);
      color: #ffe28a;
      font-weight: bold;
    }

    #fundraiserBody {
      margin-top: 10px;
      display: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 9px;
    }
    #fundraiserBox.open #fundraiserBody {
      display: block;
    }
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }
    .quota-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 5px;
      padding: 3px 5px;
      text-align: center;
      color: #9aa7c2;
    }
    .quota-chip.vault-chip {
      background: rgba(255, 196, 90, 0.12);
      border-color: rgba(255, 196, 90, 0.38);
      color: #ffe28a;
      cursor: pointer;
    }
    #searchInput {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 9px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #searchInput:focus {
      border-color: #ffc45a;
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 3px 6px;
      font-size: 10.5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: rgba(255, 196, 90, 0.25);
      border-color: #ffc45a;
      color: #fff;
    }
    #donorList {
      margin-top: 8px;
      max-height: 190px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }
    #donorList::-webkit-scrollbar,
    .vault-grid::-webkit-scrollbar,
    .wish-card::-webkit-scrollbar {
      width: 4px;
    }
    #donorList::-webkit-scrollbar-thumb,
    .vault-grid::-webkit-scrollbar-thumb,
    .wish-card::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }
    .donor-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 11.5px;
    }
    .donor-item:hover,
    .donor-item.selected {
      background: rgba(255, 196, 90, 0.16);
      border-color: rgba(255, 196, 90, 0.55);
      color: #fff;
    }
    .donor-code {
      color: #ffc45a;
      font-weight: bold;
      margin-right: 4px;
    }
    .donor-badge {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    /* Tooltip nổi theo chuột */
    #hoverTip {
      position: fixed;
      pointer-events: none;
      z-index: 25;
      display: none;
      background: rgba(10, 14, 24, 0.92);
      border: 1px solid #ffc45a;
      color: #fff;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transform: translate(12px, -50%);
    }

    /* THIỆP ĐIỀU ƯỚC & HIỂN THỊ MẪU THIẾT KẾ BÙA */
    #wishModal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 12, 0.72);
      padding: 16px;
    }
    #wishModal.visible {
      display: flex;
    }
    .wish-card {
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      background: linear-gradient(160deg, #151c30 0%, #0c101b 100%);
      border: 1px solid rgba(255, 196, 90, 0.58);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.78);
      position: relative;
      animation: popCard 0.2s ease-out;
    }
    @keyframes popCard {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .wish-close {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 9px;
      font-size: 13px;
      z-index: 2;
    }
    .wish-tag {
      display: inline-block;
      font-size: 11px;
      color: #ffc45a;
      background: rgba(255, 196, 90, 0.14);
      border: 1px solid rgba(255, 196, 90, 0.35);
      padding: 3px 8px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .wish-art-frame {
      display: none;
      margin: 2px auto 12px auto;
      padding: 7px;
      border-radius: 10px;
      background: radial-gradient(circle, rgba(255, 210, 90, 0.2) 0%, rgba(255, 255, 255, 0.03) 75%);
      border: 1px solid rgba(255, 196, 90, 0.42);
      text-align: center;
    }
    .wish-art-frame.show {
      display: block;
    }
    .wish-art-frame img {
      max-width: 100%;
      max-height: 250px;
      width: auto;
      border-radius: 7px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }
    .wish-owner {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .wish-content {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #ffc45a;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.55;
      color: #e6eefc;
      user-select: text;
    }
    .wish-actions {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .wish-hint {
      font-size: 11px;
      color: #8b98b3;
    }

    /* KHO LƯU TRỮ BÙA QUA MÔN */
    #charmVaultModal {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 12, 0.78);
      padding: 14px;
    }
    #charmVaultModal.visible {
      display: flex;
    }
    .vault-panel {
      width: 100%;
      max-width: 780px;
      max-height: 86vh;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(165deg, #131a2d 0%, #0a0e18 100%);
      border: 1px solid rgba(255, 196, 90, 0.5);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.85);
      animation: popCard 0.2s ease-out;
    }
    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .vault-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffe28a;
    }
    .vault-sub {
      font-size: 11.5px;
      color: #9aa7c2;
      margin-top: 3px;
    }
    #vaultSearch {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      margin-bottom: 12px;
    }
    #vaultSearch:focus {
      border-color: #ffc45a;
    }
    .vault-grid {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      padding-right: 4px;
    }
    .vault-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 196, 90, 0.24);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }
    .vault-card:hover {
      background: rgba(255, 196, 90, 0.12);
      border-color: #ffc45a;
    }
    .vault-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #ffc45a;
    }
    .vault-card-thumb {
      width: 100%;
      height: 110px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.28);
      padding: 4px;
    }
    .vault-card-name {
      font-size: 12.5px;
      font-weight: bold;
      color: #fff;
    }
    .vault-card-wish {
      font-size: 11px;
      color: #c2cde3;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #errorBanner {
      display: none;
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(180, 30, 40, 0.95);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #ff9aa2;
      font-size: 12px;
      max-width: 92vw;
    }

    /* =====================================================================
       TỐI ƯU GIAO DIỆN & HIỆU NĂNG ĐIỆN THOẠI (<= 680px)
       ===================================================================== */
    @media (max-width: 680px) {
      #topHud {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: 10px;
        right: 10px;
        z-index: 22;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
      }
      /* Tắt backdrop-filter trên mobile để GPU không phải làm mờ canvas 60 lần/giây */
      #fundraiserBox {
        position: static;
        width: 100%;
        max-width: 100%;
        padding: 8px 10px;
        background: rgba(12, 16, 26, 0.94);
        backdrop-filter: none;
        pointer-events: auto;
      }
      .campaign-title {
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #btnTogglePanel {
        white-space: nowrap;
        flex-shrink: 0;
        padding: 3px 8px;
      }
      .progress-wrap {
        margin-top: 6px;
        height: 6px;
      }
      .progress-meta {
        margin-top: 4px;
        font-size: 10.5px;
      }
      .milestone-row {
        margin-top: 5px;
        gap: 5px;
        font-size: 10px;
      }
      .ms-pill {
        padding: 3px 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #searchInput,
      #vaultSearch {
        font-size: 16px;
        padding: 7px 10px;
      }
      .tab-btn {
        padding: 5px 7px;
        font-size: 11px;
      }
      #donorList {
        max-height: 32vh;
        max-height: 32dvh;
      }
      .donor-item {
        padding: 8px 9px;
        font-size: 12px;
      }

      #clubLogoBox {
        position: static;
        padding: 4px 9px;
        gap: 7px;
        border-radius: 8px;
        background: rgba(12, 16, 26, 0.94);
        backdrop-filter: none;
        pointer-events: auto;
      }
      #clubLogoImg {
        height: 23px;
      }
      #clubLogoBox span.club-name {
        font-size: 10.5px;
      }

      #controls {
        left: 8px;
        right: 8px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 5px;
      }
      #controls button {
        flex: 1 1 auto;
        padding: 8px 4px;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
        border-radius: 7px;
      }

      .wish-card {
        padding: 16px;
        max-width: 100%;
      }
      .wish-art-frame img {
        max-height: 210px;
      }
      .vault-panel {
        padding: 14px;
        max-height: 88vh;
        max-height: 88dvh;
      }
      .vault-title {
        font-size: 13.5px;
      }
      .vault-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .vault-card {
        padding: 8px;
      }
      .vault-card-thumb {
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="screen"></canvas>
    <div id="errorBanner"></div>

    <div id="topHud">
      <!-- Bảng tiến độ gây quỹ & tìm vị trí người mua -->
      <div id="fundraiserBox">
        <div id="fundraiserHeader" title="Bấm để mở danh sách & tìm vị trí của bạn">
          <span class="campaign-title" id="campaignTitle">🎄 THẮP SÁNG CÂY THÔNG 2026</span>
          <button type="button" id="btnTogglePanel" style="font-size: 11px;">Tìm của bạn ▼</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
          <div class="milestone-tick" title="Mốc 50%: Bật dây kim tuyến vàng"></div>
        </div>
        <div class="progress-meta">
          <span id="progressText">Hoàn thành cây: 0%</span>
          <span id="lightStatText">💡 0/168 đèn</span>
        </div>
        <div class="milestone-row">
          <div class="ms-pill" id="pill50">🔒 50%: Kim tuyến vàng</div>
          <div class="ms-pill" id="pill100">🔒 100%: Ngôi sao đỉnh</div>
        </div>

        <div id="fundraiserBody">
          <div class="quota-grid" id="quotaGrid"></div>
          <input type="text" id="searchInput" placeholder="Nhập tên hoặc mã (VD: MS01, QM01)..." />
          <div class="filter-tabs">
            <button type="button" class="tab-btn active" data-filter="all">Tất cả</button>
            <button type="button" class="tab-btn" data-filter="qua_mon">🎓 Bùa qua môn</button>
            <button type="button" class="tab-btn" data-filter="charm">🧧 Bùa cây</button>
            <button type="button" class="tab-btn" data-filter="light">💡 Cụm đèn</button>
            <button type="button" class="tab-btn" data-filter="ornament">🎁 Quà/Châu/Tất</button>
          </div>
          <div id="donorList"></div>
          <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px;">
            <button type="button" id="btnOpenVaultSmall" class="btn-charm" style="padding: 4px 8px; font-size: 11px;">🎓 Xem kho bùa qua môn</button>
            <button type="button" id="btnClearFocus" style="padding: 4px 8px; font-size: 11px; display: none;">Bỏ chọn</button>
          </div>
        </div>
      </div>

      <!-- LOGO CLB GÓC TRÊN BÊN PHẢI -->
      <div id="clubLogoBox">
        <img id="clubLogoImg" src="logo-clb.png" alt="Logo CLB" />
        <span class="club-name">CLB HIẾN MÁU ĐHTN</span>
      </div>
    </div>

    <!-- Tooltip nổi theo chuột -->
    <div id="hoverTip"></div>

    <!-- Thiệp hiện điều ước & mẫu thiết kế bùa -->
    <div id="wishModal">
      <div class="wish-card">
        <button type="button" class="wish-close" id="btnCloseModal">✕</button>
        <div class="wish-tag" id="modalBadge">🧧 Bùa May Mắn</div>
        <div class="wish-art-frame" id="modalArtFrame">
          <img id="modalArtImg" src="" alt="Mẫu thiết kế bùa" />
        </div>
        <div class="wish-owner" id="modalOwner">Tên người gửi</div>
        <div class="wish-content" id="modalWish">Lời chúc...</div>
        <div class="wish-actions">
          <span class="wish-hint" id="modalHint">Vị trí đang phát sáng trên cây</span>
          <button type="button" id="btnCopyLink">🔗 Chép link của tôi</button>
        </div>
      </div>
    </div>

    <!-- Kho lưu trữ Bùa Qua Môn (Không gắn lên cây thông) -->
    <div id="charmVaultModal">
      <div class="vault-panel">
        <div class="vault-header">
          <div>
            <div class="vault-title" id="vaultTitle">🎓 KHO BÙA QUA MÔN (0 LÁ BÙA)</div>

      // KHO DỰ TRỮ BÙA QUA MÔN (KHÔNG GIỚI HẠN, KHÔNG GẮN LÊN CÂY THÔNG)
      const EXAM_CHARMS = [

        { id: "QM02", name: "Hồng Ly",      wish: "Chúc ôn đâu trúng đó, vào phòng thi bình tĩnh tự tin, làm bài trôi chảy đạt A+!" },
        { id: "QM03", name: "Tổ 1 YK22C",   wish: "Đêm ôn bài tỉnh táo, sáng thi minh mẫn, cả tổ cùng nắm tay nhau qua môn rực rỡ!" }

        // { id: "QM04", name: "Người mua #04", wish: "Cầu cho tất cả các môn học kỳ này đều qua thẳng một lèo, không phải gặp lại môn nào!" },
        // { id: "QM05", name: "Người mua #05", wish: "Chúc bản thân ôn trúng tủ 100%, đọc đề tới đâu nhớ bài tới đó, tự tin bứt phá GPA!" },

        // { id: "QM09", name: "Người mua #09", wish: "Chúc kỳ thi chạy trạm OSCE thật bình tĩnh, thao tác chuẩn xác và đạt điểm tối đa!" },
        // { id: "QM10", name: "Người mua #10", wish: "Cầu cho đề thi vừa sức, thầy cô chấm nương tay, qua môn trọn vẹn đón Tết vui vẻ!" },
        // { id: "QM11", name: "Người mua #11", wish: "Vượt qua mọi môn đại cương và chuyên ngành thật nhẹ nhàng, giữ vững phong độ học bổng!" },
        // { id: "QM12", name: "Người mua #12", wish: "Đêm trước ngày thi ngủ ngon giấc, sáng bước vào phòng thi đầu óc sáng suốt, viết bài mượt mà!" },
        // { id: "QM13", name: "Người mua #13", wish: "Chúc nhóm học tập của chúng ta ai cũng qua môn điểm cao, không ai bị rớt lại phía sau!" },
        // { id: "QM14", name: "Người mua #14", wish: "Thoát nợ tín chỉ thành công, bảng điểm xanh mướt toàn A với B!" },
        // { id: "QM15", name: "Người mua #15", wish: "Thi vấn đáp trả lời trôi chảy, tự tin thuyết phục thầy cô từ câu hỏi đầu tiên!" },
        // { id: "QM16", name: "Người mua #16", wish: "Mọi nỗ lực thức khuya ôn bài đều được đền đáp xứng đáng bằng kết quả qua môn rực rỡ!" },
        // { id: "QM17", name: "Người mua #17", wish: "Cầu cho môn khó nhất kỳ này cũng hóa nhẹ nhàng, làm bài dư giờ kiểm tra lại!" },
        // { id: "QM18", name: "Người mua #18", wish: "Gửi chút may mắn mùa Giáng Sinh để kỳ thi cuối năm suôn sẻ từ môn đầu tới môn cuối!" },
        // { id: "QM19", name: "Người mua #19", wish: "Chúc phòng thi mát mẻ, đề thi thân thiện, kiến thức đã ôn hiện ra rõ mồn một!" },
        // { id: "QM20", name: "Người mua #20", wish: "Bình tĩnh – Tự tin – Trúng tủ – Qua môn điểm cao!" }
      ];

      // =====================================================================
      // XỬ LÝ LOGO CLB (CHỈ HIỂN THỊ ẢNH TỪ THƯ MỤC CODE CỦA CHỦ SỞ HỮU)
      // =====================================================================
      const clubLogoImg = document.getElementById("clubLogoImg");
      const logoCandidates = ["logo-clb.png", "logo-clb.jpg", "logo-clb.jpeg", "logo-clb.webp"];
      let logoTryIdx = 0;

      clubLogoImg.onerror = () => {
        logoTryIdx++;
        if (logoTryIdx < logoCandidates.length) {
          clubLogoImg.src = logoCandidates[logoTryIdx];
        } else {
          clubLogoImg.style.display = "none";
        }
      };

      const examCharmItems = EXAM_CHARMS.map(item => ({ ...item, type: "qua_mon" }));
      const allSearchableItems = [...DONORS, ...examCharmItems];
      const DONOR_ID_TO_IDX = new Map(DONORS.map((d, i) => [d.id, i]));

      function getTreeCompletion() {
        const maxPoints = Object.values(CAMPAIGN.quotas).reduce((sum, q) => sum + q.max * q.weight, 0);
        const currentPoints = DONORS.reduce((sum, d) => sum + (CAMPAIGN.quotas[d.type]?.weight || 1.5), 0);
        let demoParam = 0;
        try {
          demoParam = Number(new URLSearchParams(window.location.search).get("demo"));
        } catch (_) {}
        const rawPercent = Math.min(100, Math.round((currentPoints / maxPoints) * 100));
        const percent = (demoParam === 50 || demoParam === 100) ? demoParam : rawPercent;
        const totalSlots = Object.values(CAMPAIGN.quotas).reduce((s, q) => s + q.max, 0);
        return { percent, currentPoints, maxPoints, totalSlots };
      }

      const treeStats = getTreeCompletion();
      const HAS_TINSEL = treeStats.percent >= 50;
      const HAS_STAR = treeStats.percent >= 100;

      function isMobileView() {
        return window.innerWidth <= 680;
      }

      // =====================================================================
      // 2. CẤU HÌNH LƯỚI ASCII & KHUNG VẼ TỐI ƯU GPU
      // =====================================================================
      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d", { alpha: false });

      const COLS = 96;
      const ROWS = 74;
      const CW = 9;
      const CH = 14;
      const FONT_PX = 14;
      const RAMP_CODES = new Uint8Array([32, 46, 58, 45, 126, 61, 43, 42, 120, 37, 38, 35, 87, 77]); // " .:-~=+*x%&#WM"
      const RAMP_LEN = RAMP_CODES.length;
      const TAU = Math.PI * 2;

      const dpr = isMobileView() ? 1.25 : Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(COLS * CW * dpr);
      canvas.height = Math.round(ROWS * CH * dpr);
      ctx.scale(dpr, dpr);

      function fitCanvas() {
        const w = window.innerWidth || document.documentElement.clientWidth || 960;
        const h = window.innerHeight || document.documentElement.clientHeight || 740;
        const scale = Math.min(w / (COLS * CW), h / (ROWS * CH));
        if (scale > 0) {
          canvas.style.width = `${Math.floor(COLS * CW * scale)}px`;
          canvas.style.height = `${Math.floor(ROWS * CH * scale)}px`;
        }
      }

      // =====================================================================
      // 3. HÀM TOÁN HỌC & BẢNG MÀU
      // =====================================================================
      let seed = 7;
      function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      }
      function uniform(a, b) {
        return a + (b - a) * rand();
      }
      function gauss() {
        let u = 0, v = 0;
        while (u === 0) u = rand();
        while (v === 0) v = rand();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(TAU * v);
      }
      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }
      function smoothstep(x) {
        const t = clamp(x, 0, 1);
        return t * t * (3 - 2 * t);
      }
      function normalize(x, y, z) {
        const len = Math.hypot(x, y, z) || 1;
        return [x / len, y / len, z / len];
      }
      function fibSphere(n) {
        const pts = [];
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = golden * i;
          pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
        }
        return pts;
      }

      const PALETTE_MAP = {
        white:  [0.96, 0.98, 1.0],
        silver: [0.86, 0.90, 0.96],
        gold:   [1.0, 0.84, 0.25],
        red:    [0.96, 0.18, 0.22],
        green:  [0.16, 0.78, 0.36],
        blue:   [0.24, 0.56, 0.98],
        jade:   [0.20, 0.94, 0.65],
        warm:   [1.0, 0.93, 0.68]
      };
      const TRUNK_COL = [0.45, 0.28, 0.15];
      const UNLIT_COL = [0.22, 0.28, 0.40];

      function resolveColor(name, fallback) {
        return PALETTE_MAP[(name || "").toLowerCase()] || fallback;
      }

      const TYPE_META = {
        light:    { icon: "💡", label: "Chùm 4 Đèn" },
        bauble:   { icon: "🔮", label: "Quả Châu" },
        gift:     { icon: "🎁", label: "Hộp Quà" },
        stocking: { icon: "🧦", label: "Tất Giáng Sinh" },
        charm:    { icon: "🧧", label: "Bùa Treo Cây" },
        qua_mon:  { icon: "🎓", label: "Bùa Qua Môn" }
      };

      // =====================================================================
      // 4. XÂY DỰNG MÔ HÌNH 3D DẠNG MẢNG TUYẾN TÍNH (TỐC ĐỘ CAO CHO MOBILE)
      // =====================================================================
      const GROUND = -1.0;
      const Y0 = -0.68;
      const Y1 = 1.05;

      const T_GROW = [0.2, 3.6];
      const T_GARLAND = [3.8, 6.0];
      const T_ORNAMENTS = [4.8, 8.2];
      const T_STAR = 8.8;
      const T_MSG = 9.6;

      // Mã loại điểm số nguyên để tránh so sánh chuỗi trong vòng lặp render
      const KIND_STD = 0;
      const KIND_LIGHT = 1;
      const KIND_CHARM = 2;
      const KIND_CHARM_THREAD = 3;
      const KIND_TINSEL = 4;
      const KIND_CORE = 5;

      function envelope(y) {
        const u = clamp((y - Y0) / (Y1 - Y0), 0, 1);
        return 0.78 * Math.pow(1 - u, 0.82) + 0.03;
      }
      function growTime(y) {
        const u = clamp((Y1 - y) / (Y1 - GROUND), 0, 1);
        return T_GROW[0] + (T_GROW[1] - T_GROW[0]) * u;
      }

      let rawPoints = [];
      let ptCount = 0;
      let ptX, ptY, ptZ, ptNx, ptNy, ptNz, ptR, ptG, ptB, ptT0, ptBase, ptPhase, ptCx, ptCy, ptCz;
      let ptKind, ptFlags, ptDonorIdx;

      let groundPts = [];
      let stars = [];
      let donorAnchors = [];
      let bulbTargets = [];
      let totalBulbs = 0;
      let litBulbsCount = 0;

      function addPoint(x, y, z, nx, ny, nz, col, kind, t0, base = 1.0, phase = 0, cx = x, cy = y, cz = z, pop = false, donorId = null, lit = true) {
        const dIdx = donorId && DONOR_ID_TO_IDX.has(donorId) ? DONOR_ID_TO_IDX.get(donorId) : -1;
        const flags = (pop ? 1 : 0) | (lit ? 2 : 0);
        rawPoints.push([x, y, z, nx, ny, nz, col[0], col[1], col[2], kind, t0, base, phase, cx, cy, cz, flags, dIdx]);
      }

      function packPointsToTypedArrays() {
        ptCount = rawPoints.length;
        ptX = new Float32Array(ptCount);
        ptY = new Float32Array(ptCount);
        ptZ = new Float32Array(ptCount);
        ptNx = new Float32Array(ptCount);
        ptNy = new Float32Array(ptCount);
        ptNz = new Float32Array(ptCount);
        ptR = new Float32Array(ptCount);
        ptG = new Float32Array(ptCount);
        ptB = new Float32Array(ptCount);
        ptKind = new Uint8Array(ptCount);
        ptT0 = new Float32Array(ptCount);
        ptBase = new Float32Array(ptCount);
        ptPhase = new Float32Array(ptCount);
        ptCx = new Float32Array(ptCount);
        ptCy = new Float32Array(ptCount);
        ptCz = new Float32Array(ptCount);
        ptFlags = new Uint8Array(ptCount);
        ptDonorIdx = new Int16Array(ptCount);

        for (let i = 0; i < ptCount; i++) {
          const p = rawPoints[i];
          ptX[i] = p[0]; ptY[i] = p[1]; ptZ[i] = p[2];
          ptNx[i] = p[3]; ptNy[i] = p[4]; ptNz[i] = p[5];
          ptR[i] = p[6]; ptG[i] = p[7]; ptB[i] = p[8];
          ptKind[i] = p[9];
          ptT0[i] = p[10];
          ptBase[i] = p[11];
          ptPhase[i] = p[12];
          ptCx[i] = p[13]; ptCy[i] = p[14]; ptCz[i] = p[15];
          ptFlags[i] = p[16];
          ptDonorIdx[i] = p[17];
        }
        rawPoints = []; // Giải phóng bộ nhớ tạm
      }

      function spawnBauble(donor, slotIdx, mobile) {
        const sphere = fibSphere(mobile ? 85 : 145);
        const u = ((slotIdx * 0.6180339) % 1);
        const y = Y0 + 0.10 + u * (Y1 - Y0 - 0.36);
        const a = slotIdx * 2.39996 + 0.3;
        const rEnv = envelope(y) + 0.035 * (1 - u);
        const cx = Math.cos(a) * rEnv;
        const cy = y - 0.03;
        const cz = Math.sin(a) * rEnv;
        const rad = 0.064 + 0.025 * (1 - u);
        const col = resolveColor(donor.color, PALETTE_MAP.red);
        const t0 = T_ORNAMENTS[0] + (slotIdx % 8) * 0.25;

        for (const [sx, sy, sz] of sphere) {
          addPoint(cx + sx * rad, cy + sy * rad, cz + sz * rad, sx, sy, sz, col, KIND_STD, t0, 1.0, 0, cx, cy, cz, true, donor.id, true);
        }
        donorAnchors.push({ donor, x: cx, y: cy, z: cz, radius: 14 });
      }

      function spawnStocking(donor, slotIdx, mobile) {
        const u = (((slotIdx + 0.35) * 0.6180339) % 1);
        const y = Y0 + 0.14 + u * (Y1 - Y0 - 0.42);
        const a = slotIdx * 2.39996 + 1.18;
        const rEnv = envelope(y) + 0.045;
        const cx = Math.cos(a) * rEnv;
        const cy = y - 0.04;
        const cz = Math.sin(a) * rEnv;
        const t0 = T_ORNAMENTS[0] + 0.4 + (slotIdx % 7) * 0.25;

        const tx = -Math.sin(a), tz = Math.cos(a);
        const rx = Math.cos(a), rz = Math.sin(a);
        const bodyCol = resolveColor(donor.color, PALETTE_MAP.red);
        const scale = mobile ? 0.65 : 1.0;

        const nCuff = Math.round(65 * scale);
        for (let i = 0; i < nCuff; i++) {
          const ang = (i / nCuff) * TAU * 3;
          const dy = (i / nCuff) * 0.028;
          const lx = Math.cos(ang) * 0.036, lz = Math.sin(ang) * 0.036;
          addPoint(cx + rx * lx + tx * lz, cy + dy, cz + rz * lx + tz * lz, rx * Math.cos(ang) + tx * Math.sin(ang), 0.3, rz * Math.cos(ang) + tz * Math.sin(ang), PALETTE_MAP.white, KIND_STD, t0, 1.0, 0, cx, cy, cz, true, donor.id, true);
        }
        const nLeg = Math.round(95 * scale);
        for (let i = 0; i < nLeg; i++) {
          const ang = (i / nLeg) * TAU * 5;
          const dy = -(i / nLeg) * 0.095;
          const lx = Math.cos(ang) * 0.031, lz = Math.sin(ang) * 0.031;
          addPoint(cx + rx * lx + tx * lz, cy + dy, cz + rz * lx + tz * lz, rx * Math.cos(ang) + tx * Math.sin(ang), 0.1, rz * Math.cos(ang) + tz * Math.sin(ang), bodyCol, KIND_STD, t0, 1.0, 0, cx, cy, cz, true, donor.id, true);
        }
        const nFoot = Math.round(75 * scale);
        for (let i = 0; i < nFoot; i++) {
          const ang = (i / nFoot) * TAU * 4;
          const footShift = (i / nFoot) * 0.068;
          const rad = 0.028 * (1 - 0.25 * (i / nFoot));
          const lx = Math.cos(ang) * rad, dy = -0.095 + Math.sin(ang) * rad;
          addPoint(cx + rx * lx + tx * footShift, cy + dy, cz + rz * lx + tz * footShift, rx * Math.cos(ang), Math.sin(ang), rz * Math.cos(ang), bodyCol, KIND_STD, t0, 1.0, 0, cx, cy, cz, true, donor.id, true);
        }

        donorAnchors.push({ donor, x: cx, y: cy - 0.04, z: cz, radius: 14 });
      }

      function spawnCharm(donor, slotIdx, mobile) {
        const u = (((slotIdx + 0.7) * 0.6180339) % 1);
        const y = Y0 + 0.18 + u * (Y1 - Y0 - 0.44);
        const a = slotIdx * 2.39996 + 2.25;
        const rEnv = envelope(y) + 0.065;
        const cx = Math.cos(a) * rEnv;
        const cy = y - 0.055;
        const cz = Math.sin(a) * rEnv;
        const t0 = T_ORNAMENTS[0] + 0.6 + (slotIdx % 6) * 0.25;
        const phase = slotIdx * 1.1;

        const rx = Math.cos(a), rz = Math.sin(a);
        const tx = -Math.sin(a), tz = Math.cos(a);
        const coreCol = resolveColor(donor.color, PALETTE_MAP.jade);

        for (let s = 1; s <= 5; s++) {
          addPoint(cx, cy + 0.048 + s * 0.008, cz, rx, 0.2, rz, PALETTE_MAP.gold, KIND_CHARM_THREAD, t0, 0.9, phase, cx, cy, cz, false, donor.id, true);
        }

        const rows = mobile ? 8 : 11;
        for (let iy = -rows; iy <= rows; iy++) {
          const nyNorm = iy / rows;
          const halfW = (1 - Math.abs(nyNorm) * 0.78) * 0.044;
          const cols = Math.max(1, Math.round(halfW / (mobile ? 0.009 : 0.007)));
          for (let ix = -cols; ix <= cols; ix++) {
            const lx = (ix / Math.max(1, cols)) * halfW;
            const ly = nyNorm * 0.052;
            const isBorder = Math.abs(iy) >= rows - 1 || Math.abs(ix) >= cols - 1;
            const isCenter = Math.abs(iy) <= 2 && Math.abs(ix) <= 1;
            const col = isBorder ? PALETTE_MAP.gold : (isCenter ? PALETTE_MAP.white : coreCol);

            for (const side of [-0.008, 0.008]) {
              addPoint(cx + tx * lx + rx * side, cy + ly, cz + tz * lx + rz * side, rx * Math.sign(side), 0.15, rz * Math.sign(side), col, KIND_CHARM, t0, 1.05, phase, cx, cy, cz, true, donor.id, true);
            }
          }
        }

        donorAnchors.push({ donor, x: cx, y: cy, z: cz, radius: 16 });
      }

      function spawnGift(donor, slotIdx, mobile) {
        const isOuter = slotIdx >= 8;
        const ringIdx = isOuter ? slotIdx - 8 : slotIdx;
        const ringCap = isOuter ? 12 : 8;
        const dist = isOuter ? 1.12 : 0.78;
        const a = (ringIdx / ringCap) * TAU + (isOuter ? 0.26 : 0.3);

        const gx = Math.cos(a) * dist;
        const gz = Math.sin(a) * dist;
        const w = 0.26 + (slotIdx % 3) * 0.025;
        const h = 0.21 + ((slotIdx + 1) % 3) * 0.03;
        const d = 0.26 + ((slotIdx + 2) % 3) * 0.02;
        const rot = a + 0.35;
        const cosR = Math.cos(rot), sinR = Math.sin(rot);
        const t0 = T_ORNAMENTS[0] + 0.8 + (slotIdx % 6) * 0.22;

        const bodyCol = resolveColor(donor.color, PALETTE_MAP.red);
        const ribCol = donor.color === "gold" ? PALETTE_MAP.red : PALETTE_MAP.gold;
        const ptsOnBox = mobile ? 440 : 950;

        for (let i = 0; i < ptsOnBox; i++) {
          const face = Math.floor(rand() * 5);
          const fa = rand() - 0.5;
          const fb = rand() - 0.5;
          let lx, ly, lz, nx, ny, nz, isRib;

          if (face === 0) {
            lx = fa * w; ly = h; lz = fb * d; nx = 0; ny = 1; nz = 0;
            isRib = Math.abs(lx) < 0.024 || Math.abs(lz) < 0.024;
          } else if (face === 1) {
            lx = w / 2; ly = (fb + 0.5) * h; lz = fa * d; nx = 1; ny = 0; nz = 0;
            isRib = Math.abs(lz) < 0.024;
          } else if (face === 2) {
            lx = -w / 2; ly = (fb + 0.5) * h; lz = fa * d; nx = -1; ny = 0; nz = 0;
            isRib = Math.abs(lz) < 0.024;
          } else if (face === 3) {
            lx = fa * w; ly = (fb + 0.5) * h; lz = d / 2; nx = 0; ny = 0; nz = 1;
            isRib = Math.abs(lx) < 0.024;
          } else {
            lx = fa * w; ly = (fb + 0.5) * h; lz = -d / 2; nx = 0; ny = 0; nz = -1;
            isRib = Math.abs(lx) < 0.024;
          }

          const wx = gx + lx * cosR - lz * sinR;
          const wy = GROUND + ly;
          const wz = gz + lx * sinR + lz * cosR;
          addPoint(wx, wy, wz, nx * cosR - nz * sinR, ny, nx * sinR + nz * cosR, isRib ? ribCol : bodyCol, KIND_STD, t0, 0.95, 0, gx, GROUND + h * 0.5, gz, true, donor.id, true);
        }

        const bowSphere = fibSphere(mobile ? 28 : 48);
        for (const [bx, by, bz] of bowSphere) {
          addPoint(gx + bx * 0.055, GROUND + h + 0.022 + by * 0.03, gz + bz * 0.055, bx, by, bz, ribCol, KIND_STD, t0 + 0.1, 1.0, 0, gx, GROUND + h, gz, true, donor.id, true);
        }

        donorAnchors.push({ donor, x: gx, y: GROUND + h * 0.55, z: gz, radius: 18 });
      }

      function buildScene() {
        const mobile = isMobileView();
        seed = 7;
        rawPoints = [];
        groundPts = [];
        stars = [];
        donorAnchors = [];
        bulbTargets = [];
        const tips = [];

        const starCount = mobile ? 140 : 240;
        for (let i = 0; i < starCount; i++) {
          stars.push({
            col: Math.floor(rand() * COLS),
            row: Math.floor(rand() * (ROWS - 12)),
            chCode: rand() < 0.28 ? 43 : rand() < 0.62 ? 42 : 46, // '+', '*', '.'
            phase: rand() * TAU,
            speed: uniform(1.5, 4.0)
          });
        }

        const groundStep = mobile ? 0.22 : 0.16;
        for (let gx = -2.4; gx <= 2.4; gx += groundStep) {
          for (let gz = -2.4; gz <= 2.4; gz += groundStep) {
            const dist = Math.hypot(gx, gz);
            if (dist <= 2.45) {
              groundPts.push({ x: gx, y: GROUND, z: gz, dist });
            }
          }
        }

        const whorls = 24;
        const needleScale = mobile ? 0.52 : 1.0;
        for (let i = 0; i < whorls; i++) {
          const y = Y0 + 0.02 + ((Y1 - 0.06 - (Y0 + 0.02)) * i) / (whorls - 1);
          const u = (y - Y0) / (Y1 - Y0);
          const R = envelope(y) + 0.05;
          const nb = Math.floor(6 + 12 * (1 - u));

          for (let b = 0; b < nb; b++) {
            const a = (TAU * (b + 0.5 * rand())) / nb + i * 0.77;
            const L = R * uniform(0.85, 1.08);
            const n = Math.floor((25 + 270 * L) * needleScale);
            const dx = Math.cos(a), dz = Math.sin(a);
            const sx = -Math.sin(a), sz = Math.cos(a);

            for (let k = 0; k < n; k++) {
              const s = Math.pow(rand(), 0.65);
              const spread = (0.025 + 0.09 * s) * gauss();
              const sl = s * L;

              const px = dx * sl + sx * spread;
              const py = y + 0.06 * sl - 0.20 * sl * sl + 0.012 * gauss();
              const pz = dz * sl + sz * spread;

              const [nx, ny, nz] = normalize(
                dx * 0.75 + 0.3 * gauss(),
                0.55 + 0.3 * gauss(),
                dz * 0.75 + 0.3 * gauss()
              );
              const ao = (0.32 + 0.70 * Math.pow(s, 1.3)) * uniform(0.75, 1.1);
              const isSnow = s > 0.52 && rand() < 0.08 * s && ny > 0.45;

              const col = isSnow
                ? PALETTE_MAP.white
                : [0.09 + 0.12 * rand(), 0.46 + 0.36 * rand(), 0.16 + 0.14 * rand()];

              addPoint(px, py, pz, nx, ny, nz, col, KIND_STD, growTime(y) + 0.45 * s, isSnow ? 1.0 : ao);
            }

            const tl = 0.93 * L;
            tips.push([dx * tl, y + 0.06 * tl - 0.20 * tl * tl, dz * tl]);
          }
        }

        const coreCount = mobile ? 2200 : 6000;
        for (let i = 0; i < coreCount; i++) {
          const y = Y0 + (Y1 - 0.1 - Y0) * rand();
          const phi = rand() * TAU;
          const r = 0.60 * envelope(y);
          const [nx, ny, nz] = normalize(Math.cos(phi), 0.3, Math.sin(phi));
          addPoint(Math.cos(phi) * r, y, Math.sin(phi) * r, nx, ny, nz, [0.03, 0.14, 0.06], KIND_CORE, growTime(y) + 0.2, 0.45);
        }

        const trunkCount = mobile ? 650 : 1500;
        for (let i = 0; i < trunkCount; i++) {
          const y = GROUND + rand() * (Y0 + 0.1 - GROUND);
          const phi = rand() * TAU;
          const nx = Math.cos(phi), nz = Math.sin(phi);
          const bark = 0.75 + 0.25 * Math.sign(Math.sin(phi * 30 + y * 5));
          addPoint(nx * 0.085, y, nz * 0.085, nx, 0, nz, TRUNK_COL, KIND_STD, growTime(y), bark);
        }

        if (HAS_TINSEL) {
          const garlandSteps = mobile ? 950 : 2000;
          const garlandSub = mobile ? 2 : 4;
          const turns = 3.6;
          for (let i = 0; i < garlandSteps; i++) {
            const u = i / (garlandSteps - 1);
            const yg = Y0 + 0.15 + (Y1 - Y0 - 0.45) * u;
            const ag = TAU * turns * u + 0.9;
            const swag = -0.07 * Math.abs(Math.sin(ag * 2.5));
            const rg = envelope(yg) + 0.07;

            for (let j = 0; j < garlandSub; j++) {
              const [nx, ny, nz] = normalize(Math.cos(ag) + 0.4 * gauss(), 0.3 + 0.4 * gauss(), Math.sin(ag) + 0.4 * gauss());
              addPoint(Math.cos(ag) * rg + 0.016 * gauss(), yg + swag + 0.016 * gauss(), Math.sin(ag) * rg + 0.016 * gauss(), nx, ny, nz, PALETTE_MAP.gold, KIND_TINSEL, T_GARLAND[0] + u * (T_GARLAND[1] - T_GARLAND[0]), 0.98, rand() * TAU);
            }
          }
        }

        const lightDonors = DONORS.filter(d => d.type === "light");
        const baubleDonors = DONORS.filter(d => d.type === "bauble");
        const giftDonors = DONORS.filter(d => d.type === "gift");
        const stockingDonors = DONORS.filter(d => d.type === "stocking");
        const charmDonors = DONORS.filter(d => d.type === "charm");

        baubleDonors.forEach((d, idx) => spawnBauble(d, idx, mobile));
        giftDonors.forEach((d, idx) => spawnGift(d, idx, mobile));
        stockingDonors.forEach((d, idx) => spawnStocking(d, idx, mobile));
        charmDonors.forEach((d, idx) => spawnCharm(d, idx, mobile));

        for (let i = tips.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [tips[i], tips[j]] = [tips[j], tips[i]];
        }
        const maxBulbsPool = CAMPAIGN.quotas.light.max * CAMPAIGN.lightsPerPurchase;
        const rawTips = tips.slice(0, Math.min(maxBulbsPool, tips.length));
        const used = new Array(rawTips.length).fill(false);
        const clusters = [];

        for (let i = 0; i < rawTips.length; i++) {
          if (used[i]) continue;
          used[i] = true;
          const seedTip = rawTips[i];
          const group = [seedTip];

          const neighbors = [];
          for (let j = 0; j < rawTips.length; j++) {
            if (used[j]) continue;
            const d = Math.hypot(rawTips[j][0] - seedTip[0], rawTips[j][1] - seedTip[1], rawTips[j][2] - seedTip[2]);
            neighbors.push({ idx: j, dist: d });
          }
          neighbors.sort((a, b) => a.dist - b.dist);

          const need = CAMPAIGN.lightsPerPurchase - 1;
          for (let k = 0; k < Math.min(need, neighbors.length); k++) {
            used[neighbors[k].idx] = true;
            group.push(rawTips[neighbors[k].idx]);
          }
          clusters.push(group);
        }

        totalBulbs = clusters.reduce((sum, g) => sum + g.length, 0);
        litBulbsCount = 0;

        const bulb = fibSphere(mobile ? 10 : 14);
        clusters.forEach((clusterTips, clusterIdx) => {
          const owner = clusterIdx < lightDonors.length ? lightDonors[clusterIdx] : null;
          const isLit = Boolean(owner);
          if (!isLit && !CAMPAIGN.showUnlitBulbs) return;

          const t0 = T_ORNAMENTS[0] + 0.15 + (clusterIdx / clusters.length) * 2.1;
          const col = isLit ? resolveColor(owner.color, PALETTE_MAP.warm) : UNLIT_COL;

          let sumX = 0, sumY = 0, sumZ = 0;
          for (const [cx, cy, cz] of clusterTips) {
            sumX += cx; sumY += cy; sumZ += cz;
            if (isLit) {
              litBulbsCount++;
              bulbTargets.push({ donor: owner, x: cx, y: cy, z: cz, radius: 13 });
            }

            const phase = rand() * TAU;
            for (const [bx, by, bz] of bulb) {
              addPoint(cx + bx * 0.029, cy + by * 0.029, cz + bz * 0.029, bx, by, bz, col, KIND_LIGHT, t0, isLit ? 1.0 : 0.28, phase, cx, cy, cz, isLit, owner ? owner.id : null, isLit);
            }
          }

          if (owner && clusterTips.length > 0) {
            donorAnchors.push({
              donor: owner,
              x: sumX / clusterTips.length,
              y: sumY / clusterTips.length,
              z: sumZ / clusterTips.length,
              radius: 16
            });
          }
        });

        packPointsToTypedArrays();
      }

      buildScene();

      // =====================================================================
      // 5. PHÉP CHIẾU 3D -> 2D & VẼ NGÔI SAO ĐỈNH CÂY
      // =====================================================================
      const sinP = Math.sin(0.15);
      const cosP = Math.cos(0.15);
      const aspect = CH / CW;

      function project(x, y, z, cosA, sinA, activeCamZ, activeFov) {
        const rx = x * cosA - z * sinA;
        const rz = x * sinA + z * cosA;
        const cy = y + 0.34;
        const cz = rz + activeCamZ;

        const py = cy * cosP - cz * sinP;
        const pz = cy * sinP + cz * cosP;
        if (pz <= 0.25) return null;

        const sx = COLS * 0.5 + (rx / pz) * activeFov * (ROWS * 0.5) * aspect;
        const sy = ROWS * 0.5 - (py / pz) * activeFov * (ROWS * 0.5);
        return { sx, sy, pz };
      }

      function pointInPoly(px, py, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i][0], yi = poly[i][1];
          const xj = poly[j][0], yj = poly[j][1];
          const intersect = ((yi > py) !== (yj > py)) &&
            (px < ((xj - xi) * (py - yi)) / ((yj - yi) || 1e-6) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      function drawStar(charGrid, colorGrid, zBuf, cx, cy, size, t, flash = 0) {
        const stretchX = 1.92;
        const tintR = 1.0;
        const tintG = 0.84 + (1.0 - 0.84) * flash;
        const tintB = 0.25 + (1.0 - 0.25) * flash;
        const boost = 1 + 1.5 * flash;

        const rayLen = Math.round(size * (0.95 + 2.8 * flash));
        for (let k = 0; k < 8; k++) {
          const ang = (k * TAU) / 8 + 0.15 * Math.sin(t * 0.7);
          const dx = Math.cos(ang) * stretchX;
          const dy = Math.sin(ang);
          for (let r = 1; r <= rayLen; r++) {
            const fade = 1 - r / (rayLen + 1);
            if (fade < 0.15 && flash < 0.1) continue;
            const col = Math.round(cx + dx * r);
            const row = Math.round(cy + dy * r);
            if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
              const idx = row * COLS + col;
              if (zBuf[idx] > 0.12) {
                zBuf[idx] = 0.12;
                charGrid[idx] = fade > 0.55 ? 42 : 43; // '*' : '+'
                const lum = clamp(fade * boost, 0.35, 1.35);
                const cr = Math.min(255, (tintR * 255 * lum) | 0);
                const cg = Math.min(255, (tintG * 255 * lum) | 0);
                const cb = Math.min(255, (tintB * 255 * lum) | 0);
                colorGrid[idx] = (cr << 16) | (cg << 8) | cb;
              }
            }
          }
        }

        const R = size * 0.95;
        const rIn = R * 0.43;
        const poly = [];
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + (i * Math.PI) / 5;
          const rad = i % 2 === 0 ? R : rIn;
          poly.push([cx + Math.cos(a) * rad * stretchX, cy + Math.sin(a) * rad]);
        }

        const maxDy = Math.ceil(R + 1);
        const maxDx = Math.ceil(R * stretchX + 1);
        for (let dy = -maxDy; dy <= maxDy; dy++) {
          for (let dx = -maxDx; dx <= maxDx; dx++) {
            const px = cx + dx;
            const py = cy + dy;
            if (!pointInPoly(px, py, poly)) continue;

            const col = Math.round(px);
            const row = Math.round(py);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) continue;

            const idx = row * COLS + col;
            zBuf[idx] = 0.08;

            const distNorm = Math.hypot(dx / stretchX, dy) / Math.max(R, 0.01);
            const chCode = distNorm < 0.34 ? 64 : distNorm < 0.68 ? 35 : 42; // '@', '#', '*'
            charGrid[idx] = chCode;
            if (chCode === 64) {
              colorGrid[idx] = (255 << 16) | (253 << 8) | 220;
            } else {
              const lum = clamp((1.12 - 0.25 * distNorm) * (1 + 0.45 * flash), 0.7, 1.35);
              const cr = Math.min(255, (tintR * 255 * lum) | 0);
              const cg = Math.min(255, (tintG * 255 * lum) | 0);
              const cb = Math.min(255, (tintB * 255 * lum) | 0);
              colorGrid[idx] = (cr << 16) | (cg << 8) | cb;
            }
          }
        }
      }

      // =====================================================================
      // 6. QUẢN LÝ TƯƠNG TÁC GÂY QUỸ, TÌM VỊ TRÍ & KHO BÙA QUA MÔN
      // =====================================================================
      let elapsed = 0;
      let angle = 0;
      let targetAngle = null;
      let dragVelocity = 0;
      let selectedDonorId = null;
      let selectedDonorIdx = -1;
      let hoveredDonorId = null;
      let hoveredDonorIdx = -1;
      let screenHitList = [];

      const fundraiserBox = document.getElementById("fundraiserBox");
      const btnTogglePanel = document.getElementById("btnTogglePanel");
      const searchInput = document.getElementById("searchInput");
      const donorListEl = document.getElementById("donorList");
      const btnClearFocus = document.getElementById("btnClearFocus");
      const hoverTip = document.getElementById("hoverTip");
      const wishModal = document.getElementById("wishModal");

      document.getElementById("campaignTitle").textContent = CAMPAIGN.title;
      document.getElementById("progressBar").style.width = `${treeStats.percent}%`;
      document.getElementById("progressText").textContent = `Hoàn thành cây: ${treeStats.percent}% (${DONORS.length}/${treeStats.totalSlots})`;
      document.getElementById("lightStatText").textContent = `💡 ${litBulbsCount}/${totalBulbs} đèn`;

      const pill50 = document.getElementById("pill50");
      const pill100 = document.getElementById("pill100");
      if (HAS_TINSEL) {
        pill50.classList.add("unlocked");
        pill50.textContent = "✅ 50%: Kim tuyến vàng";
      }
      if (HAS_STAR) {
        pill100.classList.add("unlocked");
        pill100.textContent = "✅ 100%: Ngôi sao đỉnh";
      }

      const quotaGrid = document.getElementById("quotaGrid");
      Object.entries(CAMPAIGN.quotas).forEach(([key, q]) => {
        const usedCount = DONORS.filter(d => d.type === key).length;
        const left = Math.max(0, q.max - usedCount);
        const chip = document.createElement("div");
        chip.className = "quota-chip";
        chip.textContent = `${q.icon} ${q.short}: còn ${left}/${q.max}`;
        quotaGrid.appendChild(chip);
      });

      const vaultChip = document.createElement("div");
      vaultChip.className = "quota-chip vault-chip";
      vaultChip.title = "Bấm để mở Kho Bùa Qua Môn";
      vaultChip.textContent = `🎓 Qua môn: ${examCharmItems.length} (∞)`;
      vaultChip.addEventListener("click", openVaultModal);
      quotaGrid.appendChild(vaultChip);

      function setPanelOpen(openState) {
        fundraiserBox.classList.toggle("open", openState);
        btnTogglePanel.textContent = openState ? "Thu gọn ▲" : "Tìm của bạn ▼";
      }

      document.getElementById("fundraiserHeader").addEventListener("click", () => {
        setPanelOpen(!fundraiserBox.classList.contains("open"));
      });

      let activeFilter = "all";
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.dataset.filter;
          renderDonorList();
        });
      });

      searchInput.addEventListener("input", renderDonorList);

      function renderDonorList() {
        const q = searchInput.value.trim().toLowerCase();
        donorListEl.innerHTML = "";

        const filtered = allSearchableItems.filter(d => {
          const matchText = d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q);
          if (!matchText) return false;
          if (activeFilter === "all") return true;
          if (activeFilter === "ornament") return ["gift", "bauble", "stocking"].includes(d.type);
          return d.type === activeFilter;
        });

        if (filtered.length === 0) {
          donorListEl.innerHTML = `<div style="font-size:11px; color:#7a859e; padding:6px;">Không tìm thấy tên/mã phù hợp.</div>`;
          return;
        }

        filtered.forEach(d => {
          const meta = TYPE_META[d.type] || TYPE_META.light;
          const row = document.createElement("div");
          row.className = "donor-item" + (d.id === selectedDonorId ? " selected" : "");
          row.innerHTML = `
            <div><span class="donor-code">[${d.id}]</span>${d.name}</div>
            <span class="donor-badge">${meta.icon} ${meta.label}</span>
          `;
          row.addEventListener("click", () => {
            if (isMobileView()) setPanelOpen(false);
            focusDonor(d.id, true);
          });
          donorListEl.appendChild(row);
        });
      }

      function focusDonor(donorId, openWishCard = false) {
        const item = allSearchableItems.find(d => d.id === donorId);
        if (!item) return;

        selectedDonorId = donorId;
        selectedDonorIdx = DONOR_ID_TO_IDX.has(donorId) ? DONOR_ID_TO_IDX.get(donorId) : -1;
        dragVelocity = 0;
        btnClearFocus.style.display = "inline-block";

        if (item.type !== "qua_mon") {
          const anchor = donorAnchors.find(a => a.donor.id === donorId);
          if (anchor) {
            if (elapsed < T_MSG) elapsed = T_MSG + 0.5;
            targetAngle = -Math.PI / 2 - Math.atan2(anchor.z, anchor.x);
          }
        }

        renderDonorList();
        if (openWishCard) openModalForDonor(item);
      }

      function clearFocus() {
        selectedDonorId = null;
        selectedDonorIdx = -1;
        targetAngle = null;
        btnClearFocus.style.display = "none";
        renderDonorList();
      }
      btnClearFocus.addEventListener("click", clearFocus);

      function getCharmImageFile(donor) {
        if (donor.art) return donor.art;
        if (donor.type === "qua_mon") return CAMPAIGN.charmDesigns.qua_mon;
        if (donor.type === "charm") return CAMPAIGN.charmDesigns[donor.color || "gold"];

      }

      function openModalForDonor(donor) {
        const meta = TYPE_META[donor.type] || TYPE_META.light;
        document.getElementById("modalBadge").textContent = `${meta.icon} ${meta.label} • Mã ${donor.id}`;
        document.getElementById("modalOwner").textContent = donor.name;

        const artImg = document.getElementById("modalArtImg");
        const artFile = getCharmImageFile(donor);

        if (artFile) {
          artImg.src = artFile;
          artImg.onerror = () => artFrame.classList.remove("show");
          artFrame.classList.add("show");
        } else {
          artFrame.classList.remove("show");
          artImg.src = "";
        }

        wishModal.classList.add("visible");

        const btnCopy = document.getElementById("btnCopyLink");
        btnCopy.textContent = "🔗 Chép link của tôi";
        btnCopy.onclick = () => {

            url.searchParams.set("me", donor.id);
            navigator.clipboard?.writeText(url.toString());

      document.getElementById("btnCloseModal").addEventListener("click", () => {
        wishModal.classList.remove("visible");
      });
      wishModal.addEventListener("click", (e) => {
        if (e.target === wishModal) wishModal.classList.remove("visible");
      });

      const charmVaultModal = document.getElementById("charmVaultModal");
      const vaultGrid = document.getElementById("vaultGrid");
      const vaultSearch = document.getElementById("vaultSearch");
      const btnLoadMoreVault = document.getElementById("btnLoadMoreVault");
      let vaultLimit = 36;

      function openVaultModal() {
        if (isMobileView()) setPanelOpen(false);
        document.getElementById("vaultTitle").textContent = `🎓 KHO BÙA QUA MÔN (${examCharmItems.length} LÁ BÙA)`;
        vaultLimit = 36;
        renderVaultGrid();
        charmVaultModal.classList.add("visible");
      }

      function renderVaultGrid() {
        const q = vaultSearch.value.trim().toLowerCase();
        const filtered = examCharmItems.filter(item =>
          item.name.toLowerCase().includes(q) ||
          item.id.toLowerCase().includes(q) ||
          (item.wish || "").toLowerCase().includes(q)
        );

        vaultGrid.innerHTML = "";
        if (filtered.length === 0) {
          vaultGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#8b98b3; padding:24px;">Không tìm thấy lá bùa qua môn phù hợp.</div>`;
          btnLoadMoreVault.style.display = "none";
          return;
        }

        const showCount = Math.min(filtered.length, vaultLimit);
        for (let i = 0; i < showCount; i++) {
          const item = filtered[i];
          const imgFile = getCharmImageFile(item);

          const card = document.createElement("div");
          card.className = "vault-card";
          card.innerHTML = `
            <div class="vault-card-top">
              <b>[${item.id}]</b>
              <span>🎓 Bùa Qua Môn</span>
            </div>
            ${imgFile ? `<img class="vault-card-thumb" src="${imgFile}" alt="Bùa Qua Môn" loading="lazy" onerror="this.style.display='none'" />` : ""}
            <div class="vault-card-name">${item.name}</div>
            <div class="vault-card-wish">${item.wish}</div>

          card.addEventListener("click", () => {
            charmVaultModal.classList.remove("visible");

        if (filtered.length > showCount) {
          btnLoadMoreVault.style.display = "inline-block";
          btnLoadMoreVault.textContent = `Xem thêm (${filtered.length - showCount} lá bùa còn lại) ▼`;

      document.getElementById("btnOpenVault").addEventListener("click", openVaultModal);
      document.getElementById("btnOpenVaultSmall").addEventListener("click", openVaultModal);
      document.getElementById("btnCloseVault").addEventListener("click", () => {
